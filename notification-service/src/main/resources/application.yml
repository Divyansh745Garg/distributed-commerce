server:
  port: 8084
  shutdown: graceful

spring:
  application:
    name: notification-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3
          multiplier: 2.0
        default-requeue-rejected: false # Send to DLQ instead of infinite loop
  mail:
    host: smtp.mailtrap.io
    port: 2525
    username: dummy_user
    password: dummy_password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true