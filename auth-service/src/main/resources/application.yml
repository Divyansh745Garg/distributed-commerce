server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: auth-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: true
  data:
    redis:
     host: redis #redis # Or whatever the name of the redis service is in your docker-compose.yml
     port: 6379
jwt:
  # Must be at least 256 bits (32 characters)
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  # 24 hours in milliseconds
  expirationMs: 86400000

management:
  tracing:
    sampling:
      probability: 1.0 # 100% sampling for development
  zipkin:
    tracing:
      endpoint: "http://zipkin:9411/api/v2/spans" # Points to the Docker container
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  metrics:
    tags:
      application: ${spring.application.name}
