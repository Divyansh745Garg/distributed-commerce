server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: product-service
  datasource:
    url: jdbc:postgresql://localhost:5432/commerce_db
    username: backend_user
    password: secure_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis

logging:
  level:
    com.system.product: DEBUG