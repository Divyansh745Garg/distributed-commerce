server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: product-service
  datasource:
    # Docker injects these variables. If running locally, it uses the fallback after the ':'
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/commerce_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  data:
    redis:
      # Docker injects 'redis', IDE uses 'localhost'
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379
  cache:
    type: redis
  threads:
    virtual:
      enabled: true

logging:
  level:
    com.system.product: DEBUG