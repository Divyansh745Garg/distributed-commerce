server:
  port: 8083
  shutdown: graceful

spring:
  application:
    name: order-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/commerce_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3
          multiplier: 2.0
        default-requeue-rejected: false # Send to DLQ instead of infinite loop
    publisher-confirm-type: correlated
  threads:
    virtual:
      enabled: true

# Notice how this is at the root level now (no spaces before it)
application:
  config:
    product-url: ${PRODUCT_SERVICE_URL:http://product-service:8082/api/v1/products}

management:
  tracing:
    sampling:
      probability: 1.0 # 100% sampling for development
  zipkin:
    tracing:
      endpoint: "http://zipkin:9411/api/v2/spans" # Points to the Docker container
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
